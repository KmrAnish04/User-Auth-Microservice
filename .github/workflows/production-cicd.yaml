name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy to EC2?'
        required: true
        type: boolean
        default: false

# ADD THESE LINES HERE (after "on" section, before "env")
permissions:
  contents: read          # Read repo contents
  security-events: write  # Write to Security tab
  actions: read          # Read Actions status

env:
  DOCKER_IMAGE: anish123/sso-auth-microservice
  NODE_VERSION: '20'

jobs:
  # ========================================
  # Stage 1: Validate
  # ========================================
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  # ========================================
  # Stage 2: Test
  # ========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage (optional)
        if: always()
        run: echo "Coverage report would be uploaded here"

  # ========================================
  # Stage 3: Build Docker Image
  # ========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-short: ${{ steps.meta.outputs.sha-short }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION="v1.0.${{ github.run_number }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "sha-short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build-date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKER_IMAGE}:${SHA_SHORT},${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:latest" >> $GITHUB_OUTPUT

          echo "📦 Image will be tagged as:"
          echo "  - ${DOCKER_IMAGE}:${SHA_SHORT}"
          echo "  - ${DOCKER_IMAGE}:${VERSION}"
          echo "  - ${DOCKER_IMAGE}:latest"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
            VCS_REF=${{ github.sha }}

      - name: Verify image built
        run: |
          docker images ${{ env.DOCKER_IMAGE }}
          echo "✅ Image built successfully"

  # ========================================
  # Stage 4: Security Scan
  # ========================================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build yet (learning mode)

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display scan summary
        run: |
          echo "🔍 Security scan completed"
          echo "Check Security tab in GitHub for detailed results"

  # ========================================
  # Stage 5: Push to Registry
  # ========================================
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION="v1.0.${{ github.run_number }}"

          echo "sha-short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.sha-short }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Image push summary
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Tags:"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.sha-short }}"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}"
          echo "  - ${{ env.DOCKER_IMAGE }}:latest"

  # ========================================
  # Stage 6: Deploy to EC2 (Phase 4)
  # ========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && inputs.deploy_to_ec2 == true
    # environment:
    #   name: production
    #   url: http://${{ secrets.EC2_HOST }}:3000

    steps:
      - name: Check if deployment is enabled
        id: check
        run: |
          echo "🚀 Deployment stage reached"
          echo "This will be configured in Phase 4"
          echo ""
          echo "deploy_enabled=false" >> $GITHUB_OUTPUT

      - name: Deploy placeholder
        if: steps.check.outputs.deploy_enabled == 'true'
        run: |
          echo "Deploying to EC2..."
          echo "EC2 Host: (will be configured in Phase 4)"
          # In Phase 4, we'll add:
          # - SSH connection to EC2
          # - Docker pull latest image
          # - Update docker-compose.yml
          # - Docker compose up -d
          # - Health check verification

      - name: Deployment skipped
        if: steps.check.outputs.deploy_enabled != 'true'
        run: |
          echo "⏭️ Deployment skipped (Phase 4 not started yet)"
          echo ""
          echo "In Phase 4, this will:"
          echo "  1. SSH to EC2 using secrets.EC2_HOST"
          echo "  2. Pull new Docker image"
          echo "  3. Update docker-compose.yml with new tag"
          echo "  4. Restart containers"
          echo "  5. Run health checks"
          echo "  6. Rollback if unhealthy"

  # ========================================
  # Stage 7: Notify
  # ========================================
  notify:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [validate, test, build, scan, push]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "📊 Pipeline Execution Summary"
          echo "=============================="
          echo "Validate: ${{ needs.validate.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Scan: ${{ needs.scan.result }}"
          echo "Push: ${{ needs.push.result }}"
          echo ""
          if [ "${{ needs.validate.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.scan.result }}" == "success" ]; then
            echo "✅ All critical stages passed!"
          else
            echo "❌ Some stages failed"
            exit 1
          fi
