name: Production CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      deploy_to_ec2:
        description: 'Deploy to EC2?'
        required: true
        type: boolean
        default: false

# ADD THESE LINES HERE (after "on" section, before "env")
permissions:
  contents: read          # Read repo contents
  security-events: write  # Write to Security tab
  actions: read          # Read Actions status

env:
  DOCKER_IMAGE: anish04kmr/sso-auth-microservice
  NODE_VERSION: '20'

jobs:
  # ========================================
  # Stage 1: Validate
  # ========================================
  validate:
    name: Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Security audit
        run: npm audit --audit-level=moderate
        continue-on-error: true

      - name: Check for outdated dependencies
        run: npm outdated || true

  # ========================================
  # Stage 2: Test
  # ========================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage (optional)
        if: always()
        run: echo "Coverage report would be uploaded here"

  # ========================================
  # Stage 3: Build Docker Image
  # ========================================
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: test
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      sha-short: ${{ steps.meta.outputs.sha-short }}
      version: ${{ steps.meta.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION="v1.0.${{ github.run_number }}"
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')

          echo "sha-short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build-date=${BUILD_DATE}" >> $GITHUB_OUTPUT
          echo "tags=${DOCKER_IMAGE}:${SHA_SHORT},${DOCKER_IMAGE}:${VERSION},${DOCKER_IMAGE}:latest" >> $GITHUB_OUTPUT

          echo "📦 Image will be tagged as:"
          echo "  - ${DOCKER_IMAGE}:${SHA_SHORT}"
          echo "  - ${DOCKER_IMAGE}:${VERSION}"
          echo "  - ${DOCKER_IMAGE}:latest"

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ steps.meta.outputs.build-date }}
            VCS_REF=${{ github.sha }}

      - name: Verify image built
        run: |
          docker images ${{ env.DOCKER_IMAGE }}
          echo "✅ Image built successfully"

  # ========================================
  # Stage 4: Security Scan
  # ========================================
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.DOCKER_IMAGE }}:scan
          cache-from: type=gha

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.DOCKER_IMAGE }}:scan
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Don't fail build yet (learning mode)

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Display scan summary
        run: |
          echo "🔍 Security scan completed"
          echo "Check Security tab in GitHub for detailed results"

  # ========================================
  # Stage 5: Push to Registry
  # ========================================
  push:
    name: Push to Docker Hub
    runs-on: ubuntu-latest
    needs: [build, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image_tag: ${{ steps.meta.outputs.sha-short }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Generate image metadata
        id: meta
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          VERSION="v1.0.${{ github.run_number }}"

          echo "sha-short=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.sha-short }}
            ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.DOCKER_IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
            VCS_REF=${{ github.sha }}

      - name: Image push summary
        run: |
          echo "✅ Image pushed successfully!"
          echo "📦 Tags:"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.sha-short }}"
          echo "  - ${{ env.DOCKER_IMAGE }}:${{ steps.meta.outputs.version }}"
          echo "  - ${{ env.DOCKER_IMAGE }}:latest"

  # ========================================
  # Stage 6: Deploy to EC2
  # ========================================
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@master
        env:
          IMAGE_TAG: ${{ needs.push.outputs.image_tag }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            
            echo "🚀 Starting deployment to EC2..."
            echo "Image tag: $IMAGE_TAG"
            
            # Navigate to app directory
            cd ~/sso-auth-microservice || { echo "❌ App directory not found!"; exit 1; }
            
            # Backup current docker-compose for rollback
            cp docker-compose.yml docker-compose.yml.backup || echo "No previous docker-compose to backup"
            
            # Pull latest Docker image
            echo "📥 Pulling Docker image..."
            docker pull ${{ env.DOCKER_IMAGE }}:$IMAGE_TAG
            
            # Tag as latest locally for docker-compose
            docker tag ${{ env.DOCKER_IMAGE }}:$IMAGE_TAG ${{ env.DOCKER_IMAGE }}:latest
            
            # Stop existing containers gracefully
            echo "🛑 Stopping existing containers..."
            docker compose down || echo "No containers running"
            
            # Start containers with new image
            echo "▶️  Starting containers..."
            docker compose up -d
            
            # Wait for application to be ready
            echo "⏳ Waiting for application to be healthy..."
            max_attempts=30
            attempt=0
            
            while [ $attempt -lt $max_attempts ]; do
              attempt=$((attempt + 1))
              echo "Health check attempt $attempt/$max_attempts..."
              
              if curl -f http://localhost:3000/api/v1/health > /dev/null 2>&1; then
                echo "✅ Application is healthy!"
                echo "🎉 Deployment successful!"
                exit 0
              fi
              
              if [ $attempt -lt $max_attempts ]; then
                echo "⏳ Not ready yet, waiting 10 seconds..."
                sleep 10
              fi
            done
            
            # Health check failed - rollback
            echo "❌ Health check failed after 5 minutes!"
            echo "🔄 Rolling back to previous version..."
            
            docker compose down
            
            if [ -f docker-compose.yml.backup ]; then
              mv docker-compose.yml.backup docker-compose.yml
              docker compose up -d
              echo "⚠️  Rollback complete - previous version restored"
            else
              echo "❌ No backup found - manual intervention required"
            fi
            
            exit 1

      - name: Verify Deployment
        if: success()
        run: |
          echo "🔍 Verifying deployment from external network..."
          
          # Wait a moment for EC2 to be accessible
          sleep 5
          
          # Test health endpoint from GitHub Actions (external)
          if curl -f http://${{ secrets.EC2_HOST }}:3000/api/v1/health; then
            echo "✅ External health check passed!"
            echo "🌐 Application is accessible at: http://${{ secrets.EC2_HOST }}:3000"
          else
            echo "⚠️  External health check failed (might be security group issue)"
          fi

      - name: Deployment Summary
        if: always()
        run: |
          echo "📊 Deployment Summary"
          echo "===================="
          echo "Status: ${{ job.status }}"
          echo "EC2 Host: ${{ secrets.EC2_HOST }}"
          echo "Image: ${{ env.DOCKER_IMAGE }}:${{ needs.push.outputs.image_tag }}"
          echo "Application URL: http://${{ secrets.EC2_HOST }}:3000"
          echo "Health Check: http://${{ secrets.EC2_HOST }}:3000/api/v1/health"
          echo "  6. Rollback if unhealthy"

  # ========================================
  # Stage 7: Notify
  # ========================================
  notify:
    name: Pipeline Complete
    runs-on: ubuntu-latest
    needs: [validate, test, build, scan, push]
    if: always()

    steps:
      - name: Pipeline summary
        run: |
          echo "📊 Pipeline Execution Summary"
          echo "=============================="
          echo "Validate: ${{ needs.validate.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Scan: ${{ needs.scan.result }}"
          echo "Push: ${{ needs.push.result }}"
          echo ""
          if [ "${{ needs.validate.result }}" == "success" ] && \
             [ "${{ needs.test.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ] && \
             [ "${{ needs.scan.result }}" == "success" ]; then
            echo "✅ All critical stages passed!"
          else
            echo "❌ Some stages failed"
            exit 1
          fi
