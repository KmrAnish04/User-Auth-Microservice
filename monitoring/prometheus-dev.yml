global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'development'
    service: 'sso-auth'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'sso-auth-app-dev'
    metrics_path: '/api/v1/metrics'
    static_configs:
      - targets: ['app:3000']
        labels:
          instance: 'sso-auth-dev'
