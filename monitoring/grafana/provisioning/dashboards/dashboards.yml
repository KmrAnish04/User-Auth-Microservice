# Dashboard provisioning config for Grafana
# Auto-loads dashboards from this directory

apiVersion: 1

providers:
  - name: 'SSO Auth Dashboards'
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
      foldersFromFilesStructure: false
