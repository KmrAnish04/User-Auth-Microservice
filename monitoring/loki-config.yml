# Loki Configuration for SSO Auth Microservice
# Lightweight setup optimized for t2.micro (1GB RAM)

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# Common configuration
common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

# Schema configuration
schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# Storage configuration
storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
  filesystem:
    directory: /loki/chunks

# Ingester configuration
ingester:
  chunk_idle_period: 5m
  chunk_retain_period: 30s
  max_chunk_age: 1h
  lifecycler:
    ring:
      replication_factor: 1

# Limits configuration (important for resource management)
limits_config:
  enforce_metric_name: false
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  split_queries_by_interval: 15m
  
  # Retention: 7 days (saves disk space)
  retention_period: 168h
  
  # Rate limiting (prevent memory spikes)
  ingestion_rate_mb: 4
  ingestion_burst_size_mb: 6
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  
  # Cardinality limits
  max_streams_per_user: 10000
  max_global_streams_per_user: 10000

# Chunk store configuration
chunk_store_config:
  max_look_back_period: 168h

# Table manager configuration
table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

# Compactor (cleans up old data)
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

# Query range configuration
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100
