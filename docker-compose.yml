version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo-db
    volumes:
      - mongo-data:/data/db
    ports:
      - "27018:27017"
    restart: always 

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack
    ports:
      - "6379:6379"
      - "8001:8001"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data:/data

  user-auth-server:
    build: .
    container_name: SSO-Auth-Server
    ports:
      - "3000:3000"
    environment:
      - DB_URL=${DB_DOCKER_URL}
      - REDIS_DB_URL=${REDIS_DB_DOCKER_URL}
      - sso_consumer=${sso_consumer}
      - local_consumer=${local_consumer}
      - singleSignOn_consumer=${singleSignOn_consumer}
      - Anish_Devfolio=${Anish_Devfolio}
      - Google_Page=${Google_Page}
      - KEY_WEMrm1j06ECrQ0NLGROXF6p2lxYy=${KEY_WEMrm1j06ECrQ0NLGROXF6p2lxYy}
      - KEY_l1Q7zkOL59cRqWBkQ12ZiGVW2DBL=${KEY_l1Q7zkOL59cRqWBkQ12ZiGVW2DBL}
      - KEY_NMLLXOJlpGtk5kxDL5kRSmR0jW5V=${KEY_NMLLXOJlpGtk5kxDL5kRSmR0jW5V}
      - KEY_7mR15yxkwZfXZ8Znx8rWTJy9lOJ=${KEY_7mR15yxkwZfXZ8Znx8rWTJy9lOJ}
      - KEY_WEMrm1j06ECrQ0NLGROXF6p2lxZa=${KEY_WEMrm1j06ECrQ0NLGROXF6p2lxZa} 
      - Google_Client_ID=${Google_Client_ID}
      - Google_Client_Secret=${Google_Client_Secret}
      - REFRESH_TOKEN_SECRET=${REFRESH_TOKEN_SECRET}
    depends_on:
      mongodb:
        condition: service_started
      redis-stack:
        condition: service_healthy

volumes:
  mongo-data: 
  redis-data:
