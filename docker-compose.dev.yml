services:
  mongodb:
    image: mongo:7.0
    container_name: mongo-db-dev
    volumes:
      - mongo-data-dev:/data/db
    ports:
      - "27017:27017"  # Exposed for development tools
    restart: unless-stopped

  redis-stack:
    image: redis/redis-stack:latest
    container_name: redis-stack-dev
    ports:
      - "6379:6379"  # Redis
      - "8001:8001"  # RedisInsight (GUI)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis-data-dev:/data
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: SSO-Auth-Server-Dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    depends_on:
      mongodb:
        condition: service_started
      redis-stack:
        condition: service_healthy
    restart: unless-stopped
    # Development: mount source for hot reload (optional)
    # volumes:
    #   - ./src:/app/src
    #   - ./routes:/app/routes
    #   - ./controllers:/app/controllers

volumes:
  mongo-data-dev:
  redis-data-dev:
